name: Auto Sync Google Drive Archive

on:
  workflow_dispatch: # Cho phép bạn bấm nút "Run workflow" bất kỳ lúc nào trên GitHub
  schedule:
    - cron: '0 17 * * *' # Tự động chạy mỗi ngày vào lúc 0h đêm (giờ VN = 17h UTC)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync images from Google Drive
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          npm run sync
          node scripts/classify-images.mjs

      - name: Commit and push updated assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/ src/generated/image-manifest.json
          if git diff --staged --quiet; then
            echo "No new images or changes from Google Drive."
          else
            git commit -m "chore(sync): automated assets sync from Google Drive [skip ci]"
            git push origin master
          fi
